name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  changes:
    # Skip CI on release-please's release merges — release.yml owns testing and
    # deploy for those, and the version bump + CHANGELOG would otherwise trip the
    # packages/crust/** filter. Covers both merge-commit (branch name in the merge
    # message) and squash (the "chore(...): release" PR title) strategies.
    # Non-push events (PRs) have no head_commit, so the guard is a no-op there.
    if: >-
      ${{ github.event_name != 'push'
          || (!contains(github.event.head_commit.message, 'release-please--branches')
              && !startsWith(github.event.head_commit.message, 'chore(main): release')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      package: ${{ steps.filter.outputs.package }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/crust/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/**'
            package:
              - *shared
            docs:
              - *shared
              - 'apps/docs/**'

  test-package:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    uses: ./.github/workflows/test-package.yml

  test-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/test-docs.yml
